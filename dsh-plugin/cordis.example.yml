# Example composition only. The plugin has been contract-tested in an isolated
# Cordis/dsh instance (see ../docs/dsh-integration.md section 9), but this file is
# not wired into any running harness.
#
# `host` (HostContext) is intentionally absent: it is a host-owned resolver
# injected by the runtime adapter, not a serialisable YAML field. Use
# `MemoryHostContext#toHostBinding()` (or a real host adapter) when composing in
# code. Without it the gate/probe/intervention tools fail closed.
- name: './dsh-plugin/src/index.ts'
  config:
    profile: student-facing
    targetRetention: 0.9
    allowedModes: ['preview', 'learn', 'review']
