# Example composition only. This plugin has not been contract-tested against a
# live dsh runtime yet. Before loading it, replace `src/dsh.ts` with the real
# `@deepseek-ai/cordis` and `@deepseek-ai/dsh-tools` imports and add their peer
# dependencies. See `docs/dsh-integration.md` for the full checklist.
#
# `host` (HostContext) is intentionally absent: it is a host-owned resolver
# injected by the runtime adapter, not a serialisable YAML field. Without it the
# gate/probe/intervention tools fail closed.
- name: './dsh-plugin/src/index.ts'
  config:
    profile: student-facing
    targetRetention: 0.9
    allowedModes: ['preview', 'learn', 'review']
